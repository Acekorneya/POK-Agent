[workspace]
resolver = "2"
members = [
    "crates/pok-ai-core",
    "crates/pok-ai-windows",
    "crates/pok-ai-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["KNY Industries"]
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
dunce = "1"
eventsource-stream = "0.2"
futures = "0.3"
ignore = "0.4"
image = { version = "0.24.9", default-features = false, features = ["png"] }
parking_lot = "0.12"
portable-pty = "0.9"
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep the application and Tauri dependency graph fully debuggable. Optimize
# only the capture/encoding hot path so profile changes do not produce a large
# mixture of incompatible incremental artifacts on MSVC.
[profile.dev]
opt-level = 0

[profile.dev.package.pok-ai-windows]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.screenshots]
opt-level = 2
