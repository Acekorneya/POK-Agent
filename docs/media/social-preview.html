<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{font-family:"Segoe UI",Inter,system-ui,sans-serif;color:#e6f3f1;
background:radial-gradient(900px 500px at 85% 20%,rgba(46,196,182,.22),transparent 60%),
radial-gradient(700px 480px at 10% 95%,rgba(56,120,255,.20),transparent 60%),linear-gradient(135deg,#071417,#0b1f24 55%,#0a1a2a);
display:flex;flex-direction:column;justify-content:center;padding:0 88px;box-sizing:border-box}
.logo{height:150px;align-self:flex-start;filter:drop-shadow(0 10px 40px rgba(46,220,200,.35));margin-bottom:26px}
h1{margin:0;font-size:58px;font-weight:700;letter-spacing:-1.2px;line-height:1.08}
h1 span{background:linear-gradient(90deg,#39e0c4,#3a9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:22px 0 0;font-size:27px;line-height:1.4;color:#a9c7c3;max-width:1050px}
.chips{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.chip{padding:9px 18px;border-radius:999px;border:1px solid rgba(94,220,200,.35);background:rgba(20,60,64,.55);font-size:21px;color:#cdeee8}
.foot{position:absolute;right:88px;bottom:42px;font-size:20px;color:#6f9894}
</style></head><body>
<img class="logo" src="pok-logo.png" alt="">
<h1>The Windows agent that <span>learns your tasks</span></h1>
<p>A large model plans. A small, fast model acts on screen. Repeated tasks become muscle memory, so the big model is called less every time.</p>
<div class="chips"><span class="chip">Computer use</span><span class="chip">Local-first</span><span class="chip">Voice &amp; vision</span><span class="chip">Rust · Tauri</span><span class="chip">Open source</span></div>
<div class="foot">POK-Agent · KNY Industries</div>
</body></html>
