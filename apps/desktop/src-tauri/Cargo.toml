[package]
name = "pok-ai-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pok_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
async-trait.workspace = true
dunce.workspace = true
parking_lot.workspace = true
pok-ai-core = { path = "../../../crates/pok-ai-core" }
pok-ai-windows = { path = "../../../crates/pok-ai-windows" }
process-wrap = { version = "10", features = ["tokio1"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = [] }
tauri-plugin-global-shortcut = "2"
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"
# Must track process-wrap's own pinned windows version (see its Cargo.toml)
# so PROCESS_CREATION_FLAGS is the same type on both sides of CreationFlags().
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
