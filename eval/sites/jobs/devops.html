<!doctype html><title>Apply: Platform / DevOps Engineer - Northwind Labs</title>
<h1>Apply: Platform / DevOps Engineer</h1>
<form onsubmit="event.preventDefault(); document.title='Application sent'; document.body.innerHTML='<h1>Thank you, your application was sent.</h1>'">
<p><label>Full name <input name="name" required></label></p>
<p><label>Email <input type="email" name="email" required></label></p>
<p><label>Phone <input type="tel" name="phone"></label></p>
<p><label>LinkedIn profile URL <input type="url" name="linkedin"></label></p>
<p><label>Years of professional experience <select name="years"><option value="">Choose</option><option>0-2</option><option>3-5</option><option>6-9</option><option>10+</option></select></label></p>
<p><label>Earliest start date <input type="date" name="start"></label></p>
<p><label>Which infrastructure tools have you used? <textarea name="focus" rows=3 cols=60></textarea></label></p>
<p><label><input type="checkbox" name="remote"> I want to work remotely</label></p>
<p><label>Why do you want to join Northwind Labs? <textarea name="cover" rows=5 cols=60></textarea></label></p>
<p><button type="submit">Submit application</button></p>
</form>
