[package]
name = "pok-ai-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
pok-ai-core = { path = "../pok-ai-core" }
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
enigo = "0.6.1"
screenshots = "0.8.10"
sysinfo = "0.37"
tempfile.workspace = true
uiautomation = { version = "0.25", default-features = false, features = ["control", "input"] }
windows = { version = "0.51.1", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }
winsafe = { version = "0.0.28", features = ["kernel", "user"] }
xcap = { version = "0.9.8", default-features = false }

[lints]
workspace = true
